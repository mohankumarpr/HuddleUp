name: E2E tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Set up Java (required by the Firestore/Auth emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite against the Firebase emulator
        run: npx firebase-tools emulators:exec --only firestore,auth --project demo-test "npx playwright test"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
